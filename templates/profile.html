{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}

<h2 class="section-title">👤 Your Health Profile</h2>
<p class="section-sub">Fill in your details to get a personalized diet plan</p>

<div class="card">
  <div class="card-title"><span class="card-icon">📝</span> Personal Information</div>

  <form method="POST" action="{{ url_for('profile') }}">
    <div class="form-grid">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="e.g. Thirumal Reddy" required>
      </div>

      <div class="form-group">
        <label>Age (years)</label>
        <input type="number" name="age" placeholder="e.g. 20" min="10" max="100" required>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" name="weight" placeholder="e.g. 65" min="20" max="200" step="0.1" required>
      </div>

      <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" name="height" placeholder="e.g. 170" min="100" max="250" required>
      </div>

      <div class="form-group">
        <label>Activity Level</label>
        <select name="activity" required>
          <option value="">Select Activity</option>
          <option value="sedentary">Sedentary (No exercise)</option>
          <option value="light">Light (1-3 days/week)</option>
          <option value="moderate">Moderate (3-5 days/week)</option>
          <option value="active">Active (6-7 days/week)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Health Goal</label>
        <select name="goal" required>
          <option value="">Select Goal</option>
          <option value="lose">Weight Loss 🔻</option>
          <option value="maintain">Maintain Weight ⚖️</option>
          <option value="gain">Weight Gain 🔺</option>
          <option value="muscle">Build Muscle 💪</option>
        </select>
      </div>

      <div class="form-group">
        <label>Diet Preference</label>
        <select name="diet_pref">
          <option value="veg">Vegetarian 🥦</option>
          <option value="nonveg">Non-Vegetarian 🍗</option>
          <option value="vegan">Vegan 🌱</option>
        </select>
      </div>

    </div>

    <div class="form-group mt-24">
      <label>Health Condition (optional)</label>
      <select name="condition">
        <option value="none">None</option>
        <option value="diabetes">Diabetes</option>
        <option value="bp">High Blood Pressure</option>
        <option value="cholesterol">High Cholesterol</option>
        <option value="thyroid">Thyroid</option>
      </select>
    </div>

    <div class="flex-center mt-24">
      <button type="submit" class="btn-primary">🧮 Calculate BMI & Generate Plan</button>
    </div>

  </form>
</div>

{% endblock %}
